  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^8.1.0
  flutter_svg: ^2.2.3
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  http: ^1.0.0
  in_app_purchase: ^3.2.3
  json_annotation: ^4.11.0
  media_kit: ^1.2.6
