name: drama_client
description: Flutter short drama client.
publish_to: 'none'
version: 1.0.4+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  app_links: ^7.0.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.1.1
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  drift: ^2.33.0
  crypto: ^3.0.7
  firebase_analytics: ^12.3.0
  firebase_core: ^4.7.0
  # Widget Preview uses this project as a dependency and ignores its overrides.
  # 3.11.0 fails to compile with the current Flutter/Dart SDK.
  firebase_core_web: 3.10.0
  firebase_messaging: ^16.2.0
  flutter_riverpod: ^3.3.1
  flutter_cache_manager: ^3.4.2
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.2.3
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  http: ^1.0.0
  in_app_purchase: ^3.2.3
  json_annotation: ^4.11.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  package_info_plus: ^10.1.0
  path_provider: ^2.1.0
  permission_handler: ^12.0.3
  image_picker: ^1.2.1
  sentry_flutter: ^9.20.0
  shared_preferences: ^2.5.5
  flutter_staggered_grid_view: ^0.7.0
  flutter_slidable: ^4.0.3
  bot_toast: ^4.1.3
  flutter_facebook_auth: ^7.2.0
  google_sign_in: ^7.2.0
  flutter_swiper_plus: ^2.0.4
  in_app_purchase_android: ^0.5.0
  device_info_plus: ^13.1.0
  android_id: ^0.5.1
  adjust_sdk: ^5.7.1
  flutter_udid: ^2.0.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.12.0
  readmore: ^3.0.0
  gradient_borders: ^1.0.4
  flutter_local_notifications: ^22.2.0
  easy_refresh: ^3.5.1
  sign_in_with_apple: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.13.2

  mocktail: ^1.0.0
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/home/
    - assets/images/my_list/
    - assets/images/player/
    - assets/images/profile/
    - assets/images/membership/
    - assets/images/search/
    - assets/images/common/
    - assets/images/rewards/
    - assets/images/auth/account_cancellation/
    - assets/images/auth/
    - assets/images/splash/
    - assets/navigation/
    - assets/sf-pro-display/
  fonts:
    - family: SFProDisplay
      fonts:
        - asset: assets/sf-pro-display/SFPRODISPLAYREGULAR.OTF
          weight: 400
        - asset: assets/sf-pro-display/SFPRODISPLAYMEDIUM.OTF
          weight: 500
        - asset: assets/sf-pro-display/SFPRODISPLAYBOLD.OTF
          weight: 700
